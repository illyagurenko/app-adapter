version: "3.8"

services:
  # Экземпляр 1 (Нода 161)
  app-adapter-1:
    image: app-adapter:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_adapter_1
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:oracle:thin:@(DESCRIPTION=(CONNECT_TIMEOUT=5)(TRANSPORT_CONNECT_TIMEOUT=3)(RETRY_COUNT=3)(ADDRESS_LIST=(FAILOVER=ON)(LOAD_BALANCE=OFF)(ADDRESS=(PROTOCOL=TCP)(HOST=${ORACLE_HOST_PRIMARY:-food_card_oracle})(PORT=${ORACLE_PORT_PRIMARY:-1521}))(ADDRESS=(PROTOCOL=TCP)(HOST=${ORACLE_HOST_STANDBY:-food_card_oracle})(PORT=${ORACLE_PORT_STANDBY:-1521})))(CONNECT_DATA=(SERVICE_NAME=${ORACLE_SERVICE_NAME:-XE})))"
      SPRING_DATASOURCE_USERNAME: acc_app_adapter
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 30000
      SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME: 60000
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 1800000
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER_PRIMARY:-test_kafka:29092},${KAFKA_BROKER_STANDBY:-test_kafka:29092}
      PC_NUMBER: 161
      SERVER_PORT: 8082
      DYNAMIC_LOG_PATH: /app/logs/gru-adapter-161
      CHANGER_URL: ${CHANGER_URL:-http://app-changer-1:8080}
      TZ: Europe/Moscow
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - food_bridge

  # Экземпляр 2 (Нода 162)
  app-adapter-2:
    image: app-adapter:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_adapter_2
    ports:
      - "8083:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:oracle:thin:@(DESCRIPTION=(CONNECT_TIMEOUT=5)(TRANSPORT_CONNECT_TIMEOUT=3)(RETRY_COUNT=3)(ADDRESS_LIST=(FAILOVER=ON)(LOAD_BALANCE=OFF)(ADDRESS=(PROTOCOL=TCP)(HOST=${ORACLE_HOST_PRIMARY:-food_card_oracle})(PORT=${ORACLE_PORT_PRIMARY:-1521}))(ADDRESS=(PROTOCOL=TCP)(HOST=${ORACLE_HOST_STANDBY:-food_card_oracle})(PORT=${ORACLE_PORT_STANDBY:-1521})))(CONNECT_DATA=(SERVICE_NAME=${ORACLE_SERVICE_NAME:-XE})))"
      SPRING_DATASOURCE_USERNAME: acc_app_adapter
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 30000
      SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME: 60000
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 1800000
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER_PRIMARY:-test_kafka:29092},${KAFKA_BROKER_STANDBY:-test_kafka:29092}
      PC_NUMBER: 162
      SERVER_PORT: 8082
      DYNAMIC_LOG_PATH: /app/logs/gru-adapter-162
      CHANGER_URL: ${CHANGER_URL:-http://app-changer-1:8080}
      TZ: Europe/Moscow
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - food_bridge

networks:
  food_bridge:
    external: true
